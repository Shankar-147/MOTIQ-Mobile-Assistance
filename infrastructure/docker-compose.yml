# Local development infrastructure. NOTE: unverified in this environment —
# Docker was not found installed during the bootstrap's environment assessment
# (see docs/development.md). If you have Docker, this is the fastest path to
# a working local Postgres+PostGIS and Redis; otherwise use the natively
# installed PostgreSQL 18 instance as described in docs/development.md.
version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: motiq
      POSTGRES_PASSWORD: motiq
      POSTGRES_DB: motiq_dev
    ports:
      - "5432:5432"
    volumes:
      - motiq_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  motiq_postgres_data:
